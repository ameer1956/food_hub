
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Hub - Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="navbar"></div>

    <main class="container section-space">
        <div class="simple-box form-box">
            <h1>Contact Us</h1>
            <p>Send us your message.</p>

            <form id="contact-form">
                <label for="contact-name" class="form-label">Name</label>
                <input type="text" id="contact-name" class="form-control mb-3" required>

                <label for="contact-email" class="form-label">Email</label>
                <input type="email" id="contact-email" class="form-control mb-3" required>

                <label for="contact-message" class="form-label">Message</label>
                <textarea id="contact-message" class="form-control mb-3" rows="4" required></textarea>

                <button type="submit" class="btn btn-food">Send Message</button>
                <p id="contact-result" class="mt-3"></p>
            </form>
        </div>
    </main>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/components.js"></script>
</body>
</html>
