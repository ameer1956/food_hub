
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Hub - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="navbar"></div>

    <main class="container section-space">
        <div class="simple-box form-box">
            <h1>Create Account</h1>

            <form id="register-form">
                <label for="register-name" class="form-label">Full Name</label>
                <input type="text" id="register-name" class="form-control mb-3" required>

                <label for="register-email" class="form-label">Email</label>
                <input type="email" id="register-email" class="form-control mb-3" required>

                <label for="register-password" class="form-label">Password</label>
                <input type="password" id="register-password" class="form-control mb-3" minlength="4" required>

                <button type="submit" class="btn btn-food">Register</button>
                <p id="auth-message" class="mt-3"></p>
            </form>

            <p>Already have an account? <a href="login.html">Login</a></p>
            <p class="small-note">Demo account only. Do not use a real password.</p>
        </div>
    </main>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/components.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
