
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Hub - Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="navbar"></div>

    <main class="container section-space">
        <h1>Our Menu</h1>
        <p>Choose your favourite food.</p>

        <div class="row g-3 mb-4">
            <div class="col-md-8">
                <input type="text" id="menu-search" class="form-control" placeholder="Search food">
            </div>

            <div class="col-md-4">
                <select id="menu-category" class="form-select">
                    <option value="All">All Food</option>
                    <option value="Burgers">Burgers</option>
                    <option value="Pizza">Pizza</option>
                    <option value="Sandwiches">Sandwiches</option>
                    <option value="Sides">Sides</option>
                    <option value="Desserts">Desserts</option>
                    <option value="Cold Drinks">Cold Drinks</option>
                    <option value="Combos">Combos</option>
                </select>
            </div>
        </div>

        <div id="menu-items" class="row g-4"></div>
    </main>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/components.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>
