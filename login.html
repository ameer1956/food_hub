
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Hub - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="navbar"></div>

    <main class="container section-space">
        <div class="simple-box form-box">
            <h1>Login</h1>

            <form id="login-form">
                <label for="login-email" class="form-label">Email</label>
                <input type="email" id="login-email" class="form-control mb-3" required>

                <label for="login-password" class="form-label">Password</label>
                <input type="password" id="login-password" class="form-control mb-3" required>

                <button type="submit" class="btn btn-food">Login</button>
                <p id="auth-message" class="mt-3"></p>
            </form>

            <p>Don't have an account? <a href="register.html">Register</a></p>
        </div>
    </main>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/components.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
