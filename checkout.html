
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Hub - Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="navbar"></div>

    <main class="container section-space">
        <div class="simple-box form-box">
            <h1>Checkout</h1>
            <p>Total: <strong id="checkout-total">0.00 €</strong></p>

            <form id="checkout-form">
                <label for="checkout-name" class="form-label">Full Name</label>
                <input type="text" id="checkout-name" class="form-control mb-3" required>

                <label for="checkout-address" class="form-label">Delivery Address</label>
                <input type="text" id="checkout-address" class="form-control mb-3" required>

                <button type="submit" class="btn btn-food">Place Order</button>
                <p id="checkout-message" class="mt-3"></p>
            </form>
        </div>
    </main>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/components.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
