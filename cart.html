
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Hub - Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="navbar"></div>

    <main class="container section-space">
        <h1>Your Cart</h1>

        <div class="row g-4">
            <div class="col-md-8">
                <div class="simple-box">
                    <div id="cart-items"></div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="simple-box">
                    <h2>Order Summary</h2>
                    <p>Total: <strong id="cart-total">0.00 €</strong></p>
                    <a href="checkout.html" class="btn btn-food w-100">Checkout</a>
                    <a href="menu.html" class="btn btn-outline-secondary w-100 mt-2">Continue Shopping</a>
                </div>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/components.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
