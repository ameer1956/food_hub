
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Hub - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="navbar"></div>

    <main>
        <section class="hero">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <h1>Welcome to Food Hub</h1>
                        <p>Good food, simple choices.</p>
                        <a href="menu.html" class="btn btn-food">View Menu</a>
                    </div>

                    <div class="col-md-6">
                        <img src="images/hero.jpg" alt="Burger and fries" class="hero-image">
                    </div>
                </div>
            </div>
        </section>

        <section class="container section-space">
            <h2>Popular Food</h2>

            <div class="row g-4">
                <div class="col-md-4">
                    <div class="food-card">
                        <img src="images/pizza.jpg" alt="Pizza">
                        <h3>Pizza</h3>
                        <a href="menu.html" class="btn btn-food">View Menu</a>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="food-card">
                        <img src="images/fries.jpg" alt="French fries">
                        <h3>French Fries</h3>
                        <a href="menu.html" class="btn btn-food">View Menu</a>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="food-card">
                        <img src="images/dessert.jpg" alt="Dessert">
                        <h3>Chocolate Dessert</h3>
                        <a href="menu.html" class="btn btn-food">View Menu</a>
                    </div>
                </div>
            </div>
        </section>

        <section class="container section-space">
            <div class="order-banner">
                <h2>Hungry?</h2>
                <p>Choose your favourite food and order now.</p>
                <a href="menu.html" class="btn btn-food">Order Now</a>
            </div>
        </section>
    </main>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/components.js"></script>
</body>
</html>
